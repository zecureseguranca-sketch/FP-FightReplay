<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FP-FightReplay - Lavanderia</title>

  <meta name="theme-color" content="#d10000" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon-192x192.png" />
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <div class="app">
    <div class="topbar">
      <a href="./menu.html"><button class="btn btnOutline" style="padding:8px 10px;">←</button></a>
      <div class="brand">Lavanderia</div>
      <button id="btnLogout" class="btn btnOutline" style="padding:8px 10px;">Sair</button>
    </div>

    <div class="subbar">
      <div class="tab">ARMÁRIOS</div>
      <div class="tab"><span id="freeCount">10</span> LIVRES</div>
    </div>

    <div class="container">
      <div class="card">
        <div class="cardH">
          <div class="brand" style="font-size:1rem;">Selecione um armário</div>
          <div class="divider"></div>

          <p class="muted small" style="margin:10px 0 0;">
            Clique em um armário livre para liberar a porta e deixar suas roupas.
            O sistema registra o uso e bloqueia para outros.
          </p>

          <div id="msg" class="small msgInfo" style="margin-top:10px;"></div>
        </div>

        <div class="cardB">
          <div id="lockersGrid" class="lockersGrid"></div>
          <div id="empty" class="muted small" style="display:none; margin-top:12px;">
            Nenhum armário disponível no momento.
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>

  <script type="module">
    import { applyPwaModeClass } from "./pwa.js";
    import { auth, db } from "./firebase.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";
    import {
      collection,
      doc,
      setDoc,
      serverTimestamp,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";

    applyPwaModeClass();

    const lockersGrid = document.getElementById("lockersGrid");
    const emptyEl = document.getElementById("empty");
    const msgEl = document.getElementById("msg");
    const freeCountEl = document.getElementById("freeCount");

    let currentUser = null;
    let unsubscribeLockers = null;

    // Configuração
    const LOCKERS_COUNT = 10;
    const LOCKERS_COLLECTION = "lavanderia_armarios";

    const showMsg = (t, k="info") => {
      msgEl.className = "small " + (k==="ok" ? "msgOk" : k==="error" ? "msgErr" : "msgInfo");
      msgEl.textContent = t;
    };

    function escapeHTML(str) {
      const div = document.createElement("div");
      div.appendChild(document.createTextNode(String(str ?? "")));
      return div.innerHTML;
    }

    function setEmptyState(count) {
      freeCountEl.textContent = String(count);
      emptyEl.style.display = count ? "none" : "block";
    }

    function getLockerStatusClass(status) {
      switch(status) {
        case "livre": return "lockerFree";
        case "ocupado": return "lockerBusy";
        case "manutencao": return "lockerMaintenance";
        default: return "lockerFree";
      }
    }

    function getLockerStatusText(status) {
      switch(status) {
        case "livre": return "LIVRE";
        case "ocupado": return "OCUPADO";
        case "manutencao": return "MANUTENÇÃO";
        default: return "LIVRE";
      }
    }

    function renderLockerCard(locker) {
      const card = document.createElement("div");
      card.className = `lockerCard ${getLockerStatusClass(locker.status)}`;
      card.dataset.lockerId = locker.id;
      card.dataset.status = locker.status;

      const userInfo = locker.ocupadoPor ? 
        `<div class="lockerUser">${escapeHTML(locker.ocupadoPor.email || locker.ocupadoPor.uid)}</div>` : 
        "";

      const timeInfo = locker.ocupadoDesde ? 
        `<div class="lockerTime">${formatTimeAgo(locker.ocupadoDesde)}</div>` : 
        "";

      card.innerHTML = `
        <div class="lockerNumber">${escapeHTML(String(locker.id).padStart(2, '0'))}</div>
        <div class="lockerStatus">${getLockerStatusText(locker.status)}</div>
        ${userInfo}
        ${timeInfo}
        <div class="lockerIcon">
          <svg width="24" height="24" viewBox="0 0 24 24">
            <path d="${locker.status === 'livre' ? 'M12 17c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6-9h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM8.9 6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2H8.9V6z' : 'M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM8.9 6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2H8.9V6zM16 16h-8v-2h8v2z'}"/>
          </svg>
        </div>
      `;

      if (locker.status === "livre") {
        card.addEventListener("click", () => occupyLocker(locker.id));
      }

      return card;
    }

    function formatTimeAgo(timestamp) {
      if (!timestamp) return "";
      const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
      const now = new Date();
      const diffMs = now - date;
      const diffMins = Math.floor(diffMs / 60000);
      
      if (diffMins < 1) return "Agora";
      if (diffMins < 60) return `${diffMins} min`;
      const diffHours = Math.floor(diffMins / 60);
      if (diffHours < 24) return `${diffHours} h`;
      return `${Math.floor(diffHours / 24)} d`;
    }

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "./login.html";
        return;
      }
      currentUser = user;
      startRealtimeLockers();
    });

    document.getElementById("btnLogout").addEventListener("click", async () => {
      if (unsubscribeLockers) unsubscribeLockers();
      await signOut(auth);
      window.location.href = "./login.html";
    });

    function startRealtimeLockers() {
      if (unsubscribeLockers) unsubscribeLockers();

      showMsg("Sincronizando armários...");

      const lockersRef = collection(db, LOCKERS_COLLECTION);

      unsubscribeLockers = onSnapshot(lockersRef, (snap) => {
        const lockers = [];
        snap.forEach((d) => lockers.push({ id: d.id, ...d.data() }));

        // Se não existirem armários, cria os 10 padrão
        if (lockers.length === 0) {
          createDefaultLockers();
          return;
        }

        // Ordena por número
        lockers.sort((a, b) => parseInt(a.id) - parseInt(b.id));

        lockersGrid.innerHTML = "";
        let freeCount = 0;
        
        for (const locker of lockers) {
          if (locker.status === "livre") freeCount++;
          lockersGrid.appendChild(renderLockerCard(locker));
        }

        setEmptyState(freeCount);
        showMsg(freeCount ? "Sincronizado." : "Todos armários ocupados.", freeCount ? "ok" : "info");
      }, (err) => {
        console.error("Erro no onSnapshot:", err);
        showMsg("Erro ao ler armários: " + (err?.message || String(err)), "error");
      });
    }

    async function createDefaultLockers() {
      showMsg("Criando armários padrão...");

      try {
        for (let i = 1; i <= LOCKERS_COUNT; i++) {
          await setDoc(doc(db, LOCKERS_COLLECTION, i.toString()), {
            id: i.toString(),
            status: "livre",
            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp()
          });
        }
        showMsg("Armários criados com sucesso.", "ok");
      } catch (e) {
        showMsg(e?.message || String(e), "error");
      }
    }

    async function occupyLocker(lockerId) {
      if (!currentUser) { showMsg("Sessão não carregada.", "error"); return; }
      if (lockersGrid.dataset.busy === "1") return;

      lockersGrid.dataset.busy = "1";
      showMsg(`Ocupando armário ${lockerId}...`);

      try {
        await setDoc(doc(db, LOCKERS_COLLECTION, lockerId), {
          status: "ocupado",
          ocupadoPor: {
            uid: currentUser.uid,
            email: currentUser.email || null
          },
          ocupadoDesde: serverTimestamp(),
          updatedAt: serverTimestamp()
        }, { merge: true });

        showMsg(`Armário ${lockerId} ocupado com sucesso.`, "ok");
      } catch (e) {
        showMsg(e?.message || String(e), "error");
      } finally {
        setTimeout(() => { lockersGrid.dataset.busy = "0"; }, 600);
      }
    }
  </script>

  <style>
    .lockersGrid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 12px;
    }

    @media (min-width: 768px) {
      .lockersGrid {
        grid-template-columns: repeat(5, 1fr);
      }
    }

    .lockerCard {
      background: linear-gradient(180deg, var(--dark-2), var(--dark-3));
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      transition: transform 0.2s ease, border-color 0.2s ease;
      cursor: pointer;
      position: relative;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .lockerCard:hover {
      transform: translateY(-2px);
    }

    .lockerFree {
      border-color: var(--success);
    }

    .lockerFree:hover {
      border-color: var(--success);
      box-shadow: 0 4px 12px rgba(76, 175, 80, 0.2);
    }

    .lockerBusy {
      border-color: var(--danger);
      opacity: 0.8;
      cursor: not-allowed;
    }

    .lockerMaintenance {
      border-color: var(--warning);
      opacity: 0.6;
      cursor: not-allowed;
    }

    .lockerNumber {
      font-size: 2rem;
      font-weight: 900;
      color: var(--text);
      margin-bottom: 4px;
    }

    .lockerStatus {
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 4px 8px;
      border-radius: 999px;
      margin-bottom: 8px;
    }

    .lockerFree .lockerStatus {
      background: rgba(76, 175, 80, 0.15);
      color: var(--success);
      border: 1px solid rgba(76, 175, 80, 0.3);
    }

    .lockerBusy .lockerStatus {
      background: rgba(244, 67, 54, 0.15);
      color: var(--danger);
      border: 1px solid rgba(244, 67, 54, 0.3);
    }

    .lockerMaintenance .lockerStatus {
      background: rgba(255, 193, 7, 0.15);
      color: var(--warning);
      border: 1px solid rgba(255, 193, 7, 0.3);
    }

    .lockerUser {
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 4px;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .lockerTime {
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .lockerIcon {
      margin-top: 8px;
      opacity: 0.8;
    }

    .lockerIcon svg {
      fill: currentColor;
    }

    .lockerFree .lockerIcon {
      color: var(--success);
    }

    .lockerBusy .lockerIcon {
      color: var(--danger);
    }

    .lockerMaintenance .lockerIcon {
      color: var(--warning);
    }
  </style>
</body>
</html>
